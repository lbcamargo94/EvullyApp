name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - name: Licenses (block copyleft, ARCHITECTURE.md §8)
        run: npx --yes license-checker-rseidelmann --production --excludePrivatePackages --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-3.0;SSPL-1.0"
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Evully-Setup
          path: apps/desktop/release/*.exe
          retention-days: 14
