name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:check
      - run: npm run licenses:check
      - run: npm audit --omit=dev --audit-level=high
      # Instalador só na main: em PR o build ainda roda (valida), mas não sobe artifact.
      # Retenção curta — cada .exe tem ~114 MB e a cota grátis de repo privado é 0,5 GB.
      - run: npm run dist
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Evully-Setup
          path: apps/desktop/release/*.exe
          retention-days: 3
