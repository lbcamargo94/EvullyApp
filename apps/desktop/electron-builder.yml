appId: br.com.evully.desktop
productName: Evully
copyright: Copyright (c) 2026 Lucas Camargo
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# Shown in Settings › Sobre (README §8.4).
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES
    to: THIRD_PARTY_NOTICES
# better-sqlite3 13 uses Node-API: its prebuilt binary works in Electron, no rebuild needed.
npmRebuild: false
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  artifactName: Evully-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Personal data lives in %APPDATA%\Evully and is kept on uninstall (README §15).
  deleteAppDataOnUninstall: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# Automatic updates (README §33, SECURITY.md §2.8): installers are published to a
# public releases-only repository; the source stays private. Every release gets
# latest.yml (pre-releases too), which electron-updater reads.
detectUpdateChannel: false
publish:
  provider: github
  owner: lbcamargo94
  repo: evully-releases
